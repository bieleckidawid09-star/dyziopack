<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

.header{
    background:#1e1e1e;
    border-bottom:4px solid orange;
    text-align:center;
    padding:20px;
}

.logo{
    font-size:50px;
    color:orange;
    font-weight:bold;
}

.hero{
    background:linear-gradient(to bottom,#00bfff,#111);
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:55px;
}

.texture-btn{
    background:orange;
    color:black;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:24px;
    cursor:pointer;
    font-weight:bold;
}

#packs{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.8s ease;
}

#packs.open{
    max-height:3000px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:30px;
}

.card{
    width:350px;
    background:#222;
    border:3px solid orange;
    border-radius:15px;
    overflow:hidden;
}

.preview{
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
}

.monster{
    background:linear-gradient(135deg,#00ff00,#003300);
}

.crystal{
    background:linear-gradient(135deg,#00bfff,#000033);
}

.mace{
    background:linear-gradient(135deg,#ff9900,#552200);
}

.info{
    padding:20px;
}

.info h2{
    color:#00bfff;
}

.download{
    display:inline-block;
    margin-top:10px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    background:black;
    margin-top:30px;
}

</style>
</head>
<body>

<div class="header">
<div class="logo">DyzioPack</div>
</div>

<div class="hero">

<button class="texture-btn" onclick="togglePacks()">
📦 Texturepacki
</button>

<h1>Najlepsze Texturepacki Minecraft</h1>

<p>Kliknij przycisk powyżej aby wyświetlić packi.</p>

</div>

<div id="packs">

<div class="cards">

<div class="card">
<div class="preview monster">
🟢 MONSTER
</div>

<div class="info">
<h2>Monster Energy Pack</h2>
<p>Texture Pack Monster Energy.</p>

<a class="download"
href="https://www.mediafire.com/file/a0x56yixemtg86i/Monster_Energy.zip/file"
target="_blank">
Pobierz
</a>
</div>
</div>

<div class="card">
<div class="preview crystal">
💎 CRYSTAL
</div>

<div class="info">
<h2>Crystal Pack</h2>
<p>Crystal PvP Texture Pack.</p>

<a class="download"
href="https://www.mediafire.com/file/g2y59pnxuhs4v10/Black_Pack.zip/file"
target="_blank">
Pobierz
</a>
</div>
</div>

<div class="card">
<div class="preview mace">
⚒️ MACE
</div>

<div class="info">
<h2>Mace Pack</h2>
<p>Texture Pack pod Mace PvP.</p>

<a class="download"
href="https://www.mediafire.com/file/x4acu372fy280vr/Mace_pvp.zip/file"
target="_blank">
Pobierz
</a>
</div>
</div>

</div>
</div>

<div class="footer">
© DyzioPack
</div>

<script>
function togglePacks(){
document.getElementById('packs').classList.toggle('open');
}
</script>

</body>
</html>
